name: CHS Font Test Translation
on:
  push:
    branches: [CHS]
    paths:
      - '.github/workflows/chs-font-test.yml'
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Translate INT files in 20-file batches
        run: python3 .chs-font-test.py
